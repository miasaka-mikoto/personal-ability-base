name: PAB source release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Resolve tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PAB_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Run no-network acceptance lane
        run: npm run check:offline
      - name: Package source (unsigned)
        run: npm run release:source
      - name: Verify source package and hash
        run: npm run release:check
      - name: Upload source bundle for manual runs
        uses: actions/upload-artifact@v4
        with:
          name: pab-source-${{ github.sha }}
          path: dist/releases/
          if-no-files-found: error
      - name: Publish source-only GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/releases/*
          body: |
            This is a source-only PAB release generated by CI.

            No signed Windows installer, APK, or AAB is included in this lane.
            Native artifacts require a separate, explicitly configured signing
            workflow and are not implied by this source bundle.
